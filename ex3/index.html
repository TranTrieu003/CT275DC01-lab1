<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Bài 3 - Biểu mẫu đăng nhập</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >
</head>


<body>

<div class="container py-4">


    <!-- ================================================= -->
    <!-- 1. HORIZONTAL FORM -->
    <!-- ================================================= -->

    <div class="row mb-5">

        <div class="col-md-6 mx-auto">

            <div class="card border-info">

                <!-- Tiêu đề -->

                <div class="card-header bg-info-subtle text-info-emphasis">
                    Biểu mẫu đăng nhập
                </div>


                <!-- Nội dung -->

                <div class="card-body">

                    <form>

                        <!-- Email -->

                        <div class="row mb-3">

                            <label
                                for="emailHorizontal"
                                class="col-sm-3 col-form-label fw-bold"
                            >
                                Email:
                            </label>

                            <div class="col-sm-9">

                                <input
                                    type="email"
                                    class="form-control"
                                    id="emailHorizontal"
                                    placeholder="Nhập vào email"
                                >

                            </div>

                        </div>


                        <!-- Mật khẩu -->

                        <div class="row mb-3">

                            <label
                                for="passwordHorizontal"
                                class="col-sm-3 col-form-label fw-bold"
                            >
                                Mật khẩu:
                            </label>

                            <div class="col-sm-9">

                                <input
                                    type="password"
                                    class="form-control"
                                    id="passwordHorizontal"
                                    placeholder="Nhập vào mật khẩu"
                                >

                            </div>

                        </div>


                        <!-- Ghi nhớ tôi -->

                        <div class="row mb-3">

                            <div class="offset-sm-3 col-sm-9">

                                <div class="form-check">

                                    <input
                                        class="form-check-input"
                                        type="checkbox"
                                        id="rememberHorizontal"
                                    >

                                    <label
                                        class="form-check-label"
                                        for="rememberHorizontal"
                                    >
                                        Ghi nhớ tôi
                                    </label>

                                </div>

                            </div>

                        </div>


                        <!-- Đăng nhập -->

                        <div class="row">

                            <div class="offset-sm-3 col-sm-9">

                                <button
                                    type="submit"
                                    class="btn btn-primary"
                                >
                                    Đăng nhập
                                </button>

                            </div>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>



    <!-- ================================================= -->
    <!-- 2. VERTICAL FORM -->
    <!-- ================================================= -->

    <div class="row mb-5">

        <div class="col-md-6 mx-auto">

            <div class="card border-info">

                <!-- Tiêu đề -->

                <div class="card-header bg-info-subtle text-info-emphasis">
                    Biểu mẫu đăng nhập
                </div>


                <!-- Nội dung -->

                <div class="card-body">

                    <form>

                        <!-- Email -->

                        <div class="mb-3">

                            <label
                                for="emailVertical"
                                class="form-label fw-bold"
                            >
                                Email:
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                id="emailVertical"
                                placeholder="Nhập vào email"
                            >

                        </div>


                        <!-- Password -->

                        <div class="mb-3">

                            <label
                                for="passwordVertical"
                                class="form-label fw-bold"
                            >
                                Password:
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                id="passwordVertical"
                                placeholder="Nhập vào mật khẩu"
                            >

                        </div>


                        <!-- Ghi nhớ tôi -->

                        <div class="mb-3">

                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="rememberVertical"
                                >

                                <label
                                    class="form-check-label"
                                    for="rememberVertical"
                                >
                                    Ghi nhớ tôi
                                </label>

                            </div>

                        </div>


                        <!-- Đăng nhập -->

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Đăng nhập
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>



    <!-- ================================================= -->
    <!-- 3. INLINE FORM -->
    <!-- ================================================= -->

    <div class="row mb-5">

        <div class="col-12">

            <div class="card border-info">

                <!-- Tiêu đề -->

                <div class="card-header bg-info-subtle text-info-emphasis">
                    Biểu mẫu đăng nhập
                </div>


                <!-- Nội dung -->

                <div class="card-body">

                    <form>

                        <div class="row g-2 align-items-center">


                            <!-- Email -->

                            <div class="col-md-4">

                                <div class="input-group">

                                    <span class="input-group-text">
                                        <i class="bi bi-person-fill"></i>
                                    </span>

                                    <input
                                        type="email"
                                        class="form-control"
                                        placeholder="Nhập vào email"
                                    >

                                </div>

                            </div>


                            <!-- Mật khẩu -->

                            <div class="col-md-4">

                                <div class="input-group">

                                    <span class="input-group-text">
                                        <i class="bi bi-lock-fill"></i>
                                    </span>

                                    <input
                                        type="password"
                                        class="form-control"
                                        placeholder="Nhập vào mật khẩu"
                                    >

                                </div>

                            </div>


                            <!-- Ghi nhớ tôi -->

                            <div class="col-md-auto">

                                <div class="form-check">

                                    <input
                                        class="form-check-input"
                                        type="checkbox"
                                        id="rememberInline"
                                    >

                                    <label
                                        class="form-check-label"
                                        for="rememberInline"
                                    >
                                        Ghi nhớ tôi
                                    </label>

                                </div>

                            </div>


                            <!-- Đăng nhập -->

                            <div class="col-md-auto">

                                <button
                                    type="submit"
                                    class="btn btn-primary"
                                >
                                    Đăng nhập
                                </button>

                            </div>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>



    <!-- ================================================= -->
    <!-- 4. LOGIN MODAL -->
    <!-- ================================================= -->

    <div class="row">

        <div class="col-md-6 mx-auto">

            <div class="border border-danger p-3">

                <h2 class="mb-3">
                    Mở biểu mẫu đăng nhập
                </h2>


                <!-- Mở hộp thoại -->

                <button
                    type="button"
                    class="btn btn-info text-white"
                    data-bs-toggle="modal"
                    data-bs-target="#loginModal"
                >
                    Mở hộp thoại
                </button>

            </div>

        </div>

    </div>

</div>



<!-- ================================================= -->
<!-- LOGIN MODAL -->
<!-- ================================================= -->

<div
    class="modal fade"
    id="loginModal"
    tabindex="-1"
    aria-labelledby="loginModalLabel"
    aria-hidden="true"
>

    <div class="modal-dialog modal-lg">

        <div class="modal-content">


            <!-- Header -->

            <div class="modal-header">

                <h2
                    class="modal-title"
                    id="loginModalLabel"
                >
                    <i class="bi bi-lock-fill"></i>
                    Đăng nhập
                </h2>


                <!-- X -->

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                ></button>

            </div>



            <!-- Body -->

            <div class="modal-body">

                <form>


                    <!-- Người dùng -->

                    <div class="mb-3">

                        <label
                            for="modalUser"
                            class="form-label fw-bold"
                        >
                            <i class="bi bi-person-fill"></i>
                            Người dùng:
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="modalUser"
                            placeholder="Nhập tên người dùng"
                        >

                    </div>


                    <!-- Mật khẩu -->

                    <div class="mb-3">

                        <label
                            for="modalPassword"
                            class="form-label fw-bold"
                        >
                            <i class="bi bi-eye-fill"></i>
                            Mật khẩu:
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            id="modalPassword"
                            placeholder="Nhập mật khẩu"
                        >

                    </div>


                    <!-- Ghi nhớ tôi -->

                    <div class="mb-3">

                        <div class="form-check">

                            <input
                                class="form-check-input"
                                type="checkbox"
                                id="modalRemember"
                            >

                            <label
                                class="form-check-label"
                                for="modalRemember"
                            >
                                Ghi nhớ tôi
                            </label>

                        </div>

                    </div>


                    <!-- Đăng nhập -->

                    <button
                        type="submit"
                        class="btn btn-success w-100"
                    >
                        <i class="bi bi-power"></i>
                        Đăng nhập
                    </button>

                </form>

            </div>



            <!-- Footer -->

            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-danger me-auto"
                    data-bs-dismiss="modal"
                >
                    <i class="bi bi-x-lg"></i>
                    Hủy bỏ
                </button>


                <div class="text-end">

                    <div>
                        Bạn chưa phải là thành viên?
                        <a href="#">Đăng ký</a>
                    </div>

                    <div>
                        <a href="#">Quên mật khẩu?</a>
                    </div>

                </div>

            </div>


        </div>

    </div>

</div>



<!-- ================================================= -->
<!-- BOOTSTRAP JAVASCRIPT -->
<!-- ================================================= -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
></script>


</body>

</html>
